<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Filtro de Resplandor Cian -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Transparente / Estructura Hexagonal (Insignia Dev Core) -->
  <polygon points="100,15 173,57 173,143 100,185 27,143 27,57" 
           fill="#0a1128" 
           stroke="#00b4d8" 
           stroke-width="6" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Línea Interna de Acento -->
  <polygon points="100,25 163,62 163,138 100,175 37,138 37,62" 
           fill="none" 
           stroke="#1c2541" 
           stroke-width="3"/>

  <!-- Símbolo Terminal '>' Integrado (Acento Cian) -->
  <path d="M 60 70 L 85 90 L 60 110" 
        fill="none" 
        stroke="#00b4d8" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Monograma 'E' y 'S' Trazo Blanco -->
  <path d="M 90 70 H 135 M 90 90 H 125 M 90 110 H 135" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round"/>

  <path d="M 90 70 V 110" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round"/>

  <!-- Nodos Backend (Puntos de Conexión) -->
  <circle cx="135" cy="70" r="6" fill="#00b4d8" />
  <circle cx="135" cy="110" r="6" fill="#00b4d8" />
  <circle cx="125" cy="90" r="5" fill="#90e0ef" />
</svg>
